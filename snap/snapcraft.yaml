# Inkline as a Snap, for the Snap Store and Ubuntu's App Center. Built by the release (snapcore/action-build) for
# x86-64 and ARM64; by hand: snapcraft, in the repository's top folder (needs LXD or Multipass).
#
# Its own Python packages (PySide6's Essentials and numpy, from PyPI) in a virtual environment on core24's Python;
# the desktop libraries Qt needs come from the gnome extension. A Snap updates itself from the Store, so Inkline
# only says when there's a new version (updater.install_kind is "snap").
name: inkline
title: Inkline
base: core24
adopt-info: app
summary: Black & white images for printing
description: |
  Inkline makes colouring pages, puzzles and black and white photo prints, ready to print at true paper size:
  mandalas, mazes, dot-to-dots, sudoku, kakuro, nonograms, spot the difference, word search and name pages;
  dithered, halftone, engraved and stippled photos; booklets, photo books and posters. Print, or save as PDF,
  PNG or SVG.
license: GPL-3.0-or-later
website: https://github.com/Gshoe2006/inkline
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  inkline:
    command: bin/inkline
    desktop: share/applications/inkline.desktop
    extensions: [gnome]
    common-id: io.github.gshoe2006.Inkline
    environment:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    plugs:
      - home
      - removable-media
      - network
      - cups-control

parts:
  deps:
    plugin: python
    source: snap/local
    python-packages:
      - PySide6-Essentials==6.12.0
      - shiboken6==6.12.0
      - numpy==2.3.5
    stage-packages:
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-keysyms1
      - libxcb-shape0
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - libegl1
      - libgl1

  app:
    plugin: dump
    source: .
    override-pull: |
      craftctl default
      craftctl set version="$(cat VERSION)"
    override-build: |
      A="$CRAFT_PART_INSTALL/share/inkline"
      mkdir -p "$A" "$CRAFT_PART_INSTALL/bin" "$CRAFT_PART_INSTALL/share/applications" "$CRAFT_PART_INSTALL/share/metainfo"
      cp -r inkengine inkapp "$A/"
      cp inkline.py inkline.svg VERSION CHANGELOG.md LICENSE "$A/"
      find "$A" -name __pycache__ -prune -exec rm -rf {} +
      sed -e 's|^Icon=.*|Icon=${SNAP}/share/inkline/inkline.svg|' -e 's|^Exec=.*|Exec=inkline %f|' \
        inkline.desktop > "$CRAFT_PART_INSTALL/share/applications/inkline.desktop"
      cp packaging/flatpak/io.github.gshoe2006.Inkline.metainfo.xml "$CRAFT_PART_INSTALL/share/metainfo/"
      printf '#!/bin/sh\nexec "$SNAP/bin/python3" "$SNAP/share/inkline/inkline.py" "$@"\n' > "$CRAFT_PART_INSTALL/bin/inkline"
      chmod 755 "$CRAFT_PART_INSTALL/bin/inkline"
    prime:
      - bin/inkline
      - share/inkline
      - share/applications
      - share/metainfo
