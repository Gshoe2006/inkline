# Tells the app portal (Gshoe2006/Apps) to rebuild as soon as a release is
# published, instead of waiting up to 3 hours for its scheduled run.
#
# Needs the secret PORTAL_TOKEN: a fine-grained personal access token with
# access to the Apps repository only and "Contents: Read and write". Without
# it this workflow skips with a notice and the portal still updates on its
# schedule.
name: Tell the app portal

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the portal to rebuild
        env:
          PORTAL_TOKEN: ${{ secrets.PORTAL_TOKEN }}
        run: |
          if [ -z "$PORTAL_TOKEN" ]; then
            echo "::notice::PORTAL_TOKEN isn't set, so the portal will pick this release up on its next scheduled run."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $PORTAL_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Gshoe2006/Apps/dispatches \
            -d '{"event_type":"app-released"}'
          echo "Portal rebuild requested."
