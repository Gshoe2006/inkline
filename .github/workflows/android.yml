# Android, a first test (not part of releases yet): builds Inkline's window as it is into an APK with Qt's
# pyside6-android-deploy (packaging/android/build.py), for ARM64 phones and tablets and for x86-64, then starts the
# x86-64 one on an emulator: a screenshot of the window, then the self-test, whose files are checked as on desktop.
# Run it from the Actions tab (Run workflow), or it runs on pull requests that change packaging/android.
name: Android

on:
  workflow_dispatch:
  pull_request:
    paths: [packaging/android/**, .github/workflows/android.yml]

permissions:
  contents: read

jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: "28.2.13676358"   # r28c, what pyside6-android-deploy 6.12 builds with
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"   # python-for-android needs JDK 17

      - name: Install build tools, PySide6 (for its deploy tool) and the Android SDK parts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential lld ccache
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials==6.12.0 shiboken6==6.12.0 jinja2 pkginfo tqdm packaging==24.1
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" \
            "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Fetch Qt's PySide6 6.12.0 Android wheels
        run: |
          mkdir -p wheels
          for pkg in pyside6 shiboken6; do
            base="https://download.qt.io/official_releases/QtForPython/$pkg/"
            curl -fsSL "$base" -o "$pkg.html"
            name=$(grep -oiE "href=\"[^\"]*6\.12\.0[^\"]*android_${{ matrix.arch }}\.whl\"" "$pkg.html" | head -1 | sed 's/^href="//; s/"$//')
            if [ -z "$name" ]; then
              echo "::error::No 6.12.0 Android ${{ matrix.arch }} wheel for $pkg at $base. Android wheels there:"
              grep -oiE "href=\"[^\"]*android[^\"]*\"" "$pkg.html" | head -40
              exit 1
            fi
            case "$name" in http*) url="$name" ;; *) url="$base$name" ;; esac
            echo "$pkg: $url"
            curl -fsSL -o "wheels/$(basename "$name")" "$url"
          done
          ls -l wheels

      - name: Build the APK
        run: |
          python packaging/android/build.py --arch ${{ matrix.arch }} \
            --wheel-pyside wheels/PySide6-*.whl --wheel-shiboken wheels/shiboken6-*.whl \
            --ndk "$ANDROID_HOME/ndk/$NDK_VERSION" --sdk "$ANDROID_HOME"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.arch }}
          path: dist/inkline-*-android-*.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: android-x86_64
          path: dist

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Start Inkline on an emulator, then run its self-test there
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sh packaging/android/emulator-test.sh dist/inkline-*-android-x86_64.apk android-test

      - name: Check the files the self-test wrote on Android
        run: python3 packaging/check_selftest.py android-test/selftest

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-emulator-test
          path: android-test/
          retention-days: 14
