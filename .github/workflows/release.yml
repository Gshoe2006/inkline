# Publishes a GitHub Release whenever VERSION changes on main to a version that has no release yet.
#
#   1. check    VERSION is a new version, and CHANGELOG.md has notes for it
#   2. selftest the same self-test every pull request runs (selftest.yml)
#   3. build    the .run installer and the Arch package (in Arch Linux), the .flatpak, the Debian/Ubuntu .deb and
#               the AppImage (each for x86-64 and ARM64), the Fedora/openSUSE .rpm (x86-64 and ARM64), the .snap (x86-64 and ARM64),
#               the Windows installer and portable .zip, and the macOS disk images (universal, Apple silicon, Intel)
#   4. release  tags the commit, publishes "Inkline <version>" with those notes and the sixteen files,
#               then tells the app portal (Gshoe2006/Apps) to show it straight away
#
# Nothing is published unless every step passes. To release: in one pull request, bump VERSION and
# add a "## <version>" section to CHANGELOG.md, then merge it. "Run workflow" on the Actions tab
# releases the current VERSION if that hasn't happened yet (for example after fixing a failed build).
#
# Tick "Test build only" under Run workflow to do everything but publish: the notes check, the
# self-test and all sixteen builds, with the packages kept for 7 days under the run's Artifacts.
# Releases are only ever published from main.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      test_only:
        description: "Test build only: build and keep the packages, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this a new version?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ONLY: ${{ inputs.test_only == true }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::VERSION should look like 3.4.3, not '$V'."
            exit 1
          fi
          RELEASED=false
          gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && RELEASED=true
          if [ "$TEST_ONLY" = true ]; then
            echo "::notice::Test build of Inkline $V: everything runs except publishing."
            BUILD=true PUBLISH=false
          elif [ "$RELEASED" = true ]; then
            echo "::notice::Inkline $V is already released, so there's nothing to do."
            BUILD=false PUBLISH=false
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::notice::Releases are only published from main, so this run on $GITHUB_REF_NAME builds without publishing."
            BUILD=true PUBLISH=false
          else
            BUILD=true PUBLISH=true
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Are there release notes for it?
        if: steps.version.outputs.build == 'true'
        run: |
          python3 packaging/release_notes.py > /dev/null
          V=${{ steps.version.outputs.version }}
          grep -q "<release version=\"$V\"" packaging/flatpak/io.github.gshoe2006.Inkline.metainfo.xml ||
            echo "::warning file=packaging/flatpak/io.github.gshoe2006.Inkline.metainfo.xml::No <release version=\"$V\"> entry. Flathub and app stores list releases from this file."

  selftest:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/selftest.yml

  run-and-arch:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git python

      - uses: actions/checkout@v7

      - name: Build the .run installer and the Arch package
        run: |
          # A fresh checkout gives every file the same time, so keep build.sh from redrawing the
          # icons (that needs librsvg); the committed ones are already current.
          touch inkline.svg
          # makepkg refuses to run as root
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder sh packaging/build.sh
          V=${{ needs.check.outputs.version }}
          test -f "dist/inkline-$V.run"
          ls dist/inkline-"$V"-*.pkg.tar.zst

      # Help → Check for updates installs a newer version the way this one was installed, which each package
      # records: install them here and check each says the right thing
      - name: Install the Arch package and the .run, and check how each says it was installed
        run: |
          V=${{ needs.check.outputs.version }}
          pacman -U --noconfirm dist/inkline-"$V"-*.pkg.tar.zst
          python3 packaging/check_install_kind.py /usr/share/inkline arch
          sudo -u builder sh "dist/inkline-$V.run"
          python3 packaging/check_install_kind.py /home/builder/.local/share/inkline run-user
          sh "dist/inkline-$V.run" --system
          python3 packaging/check_install_kind.py /usr/local/share/inkline run-system

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-run-and-arch
          path: |
            dist/inkline-*.run
            dist/inkline-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  flatpak:
    needs: check
    if: needs.check.outputs.build == 'true'
    # flatpak-builder runs the machine's own appstreamcli on the metainfo; 24.04's is too old for it
    # ("file-read-error"), so build on the newest Ubuntu, nearer the tools Arch ships
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils   # elfutils: eu-strip, which flatpak-builder runs on the host

      - name: Build the .flatpak
        run: |
          sh packaging/flatpak/build.sh --bundle
          test -f "dist/inkline-${{ needs.check.outputs.version }}.flatpak"

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-flatpak
          path: dist/inkline-*.flatpak
          if-no-files-found: error
          retention-days: 7

  deb:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }   # Raspberry Pi 4 and 5, ARM laptops (glibc 2.39 or newer)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the .deb
        run: |
          sh packaging/debian/build-deb.sh ${{ matrix.arch }}
          test -f "dist/inkline_${{ needs.check.outputs.version }}-1_${{ matrix.arch }}.deb"

      - name: Install it and run the self-test with it
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils "./dist/inkline_${{ needs.check.outputs.version }}-1_${{ matrix.arch }}.deb"   # poppler-utils: check_selftest reads the PDFs
          QT_QPA_PLATFORM=offscreen inkline --selftest deb-selftest
          python3 packaging/check_selftest.py deb-selftest --install-kind deb

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-deb-${{ matrix.arch }}
          path: dist/inkline_*.deb
          if-no-files-found: error
          retention-days: 7

  appimage:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        include:
          # built on the oldest Ubuntu it can be, so the AppImage runs on distributions at least as new
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }   # PySide6's ARM64 build needs glibc 2.39
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the AppImage
        run: |
          pip install uv || python3 -m pip install --user --break-system-packages uv
          export PATH="$HOME/.local/bin:$PATH"
          sh packaging/appimage/build-appimage.sh
          test -f "dist/inkline-${{ needs.check.outputs.version }}-${{ matrix.arch }}.AppImage"

      - name: Run the self-test with it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 poppler-utils   # poppler-utils: check_selftest reads the PDFs
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 \
            "./dist/inkline-${{ needs.check.outputs.version }}-${{ matrix.arch }}.AppImage" --selftest appimage-selftest
          python3 packaging/check_selftest.py appimage-selftest --install-kind appimage

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-appimage-${{ matrix.arch }}
          path: dist/inkline-*.AppImage
          if-no-files-found: error
          retention-days: 7

  rpm:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }   # PySide6's ARM64 build needs glibc 2.39 (Fedora 40+)
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    timeout-minutes: 20
    steps:
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False rpm-build python3 curl findutils poppler-utils

      - uses: actions/checkout@v7

      - name: Build the .rpm
        run: |
          sh packaging/rpm/build-rpm.sh ${{ matrix.arch }}
          test -f "dist/inkline-${{ needs.check.outputs.version }}-1.${{ matrix.arch }}.rpm"

      - name: Install it on Fedora and run the self-test with it
        run: |
          dnf install -y "./dist/inkline-${{ needs.check.outputs.version }}-1.${{ matrix.arch }}.rpm"
          QT_QPA_PLATFORM=offscreen inkline --selftest rpm-selftest
          python3 packaging/check_selftest.py rpm-selftest --install-kind rpm

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-rpm-${{ matrix.arch }}
          path: dist/inkline-*.rpm
          if-no-files-found: error
          retention-days: 7

  # the same .rpm on openSUSE: it asks for libraries by file, which zypper must find there too
  rpm-opensuse:
    needs: [check, rpm]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: zypper --non-interactive install --no-recommends tar gzip poppler-tools python3

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pkg-rpm-x86_64
          path: dist

      - name: Install it on openSUSE and run the self-test with it
        run: |
          zypper --non-interactive install --allow-unsigned-rpm "./dist/inkline-${{ needs.check.outputs.version }}-1.x86_64.rpm"
          QT_QPA_PLATFORM=offscreen inkline --selftest rpm-selftest
          python3 packaging/check_selftest.py rpm-selftest --install-kind rpm

  snap:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build the .snap
        id: snap
        uses: snapcore/action-build@v1

      - name: Install it and run the self-test with it
        run: |
          sudo snap install --dangerous "${{ steps.snap.outputs.snap }}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          QT_QPA_PLATFORM=offscreen inkline --selftest "$HOME/snap-selftest"
          python3 packaging/check_selftest.py "$HOME/snap-selftest" --install-kind snap
          mkdir -p dist
          cp "${{ steps.snap.outputs.snap }}" dist/
          test -f "dist/inkline_${{ needs.check.outputs.version }}_${{ matrix.arch }}.snap"

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-snap-${{ matrix.arch }}
          path: dist/inkline_*.snap
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 90   # signing waits for someone to approve the release in SignPath (see docs/code-signing.md)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PySide6, numpy, PyInstaller and Inno Setup
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials==6.12.0 shiboken6==6.12.0 numpy==2.3.5 pyinstaller
          choco install innosetup -y --no-progress

      - name: Build the app and its installer
        run: |
          python packaging/windows/build.py
          if (-not (Test-Path "dist/inkline-${{ needs.check.outputs.version }}-windows-setup.exe")) { exit 1 }
          if ((Get-Content dist/Inkline/_internal/VERSION).Trim() -ne "${{ needs.check.outputs.version }}") { exit 1 }

      - name: Run the self-test with the built Inkline.exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import subprocess, sys; sys.exit(subprocess.run([r'dist\Inkline\Inkline.exe', '--selftest', r'windows-selftest\installed']).returncode)"

      - name: Unzip the portable copy and run the self-test with it
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Expand-Archive "dist/inkline-${{ needs.check.outputs.version }}-windows-portable.zip" -DestinationPath portable
          python -c "import subprocess, sys; sys.exit(subprocess.run([r'portable\Inkline\Inkline.exe', '--selftest', r'windows-selftest\portable']).returncode)"

      # Help → Check for updates automatically sets these up for the person: Windows must accept them as written
      - name: Set up and remove the update check's task and login entry
        run: |
          python -c "from inkapp import update_schedule as u; import sys; e = u.apply('daily', 'windows'); print(e); sys.exit(1 if e else 0)"
          schtasks /Query /TN "Inkline update check" /XML
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "from inkapp import update_schedule as u; import sys; e = u.apply('login', 'windows'); print(e); sys.exit(1 if e else 0)"
          (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."Inkline update check"
          if (-not (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."Inkline update check") { exit 1 }
          schtasks /Query /TN "Inkline update check" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Error "the daily task should be gone"; exit 1 }
          python -c "from inkapp import update_schedule as u; u.apply(None, 'windows')"
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."Inkline update check") { exit 1 }
          $global:LASTEXITCODE = 0

      - name: Check the installer's file details
        run: |
          $exe = Get-Item "dist/inkline-${{ needs.check.outputs.version }}-windows-setup.exe"
          $info = $exe.VersionInfo
          # Inno Setup pads these with spaces (it leaves room to write them in): what counts is the text
          $name, $ver = $info.ProductName.Trim(), $info.ProductVersion.Trim()
          "Product: '$name' '$ver'"
          if ($name -ne "Inkline" -or $ver -ne "${{ needs.check.outputs.version }}") { exit 1 }

      # Signing (docs/code-signing.md): only for a release, and only once SignPath is set up for the repository
      # (the SIGNPATH_ORGANIZATION_ID variable and the SIGNPATH_API_TOKEN secret). Without them the installer
      # is published unsigned, as before.
      - name: Keep the unsigned installer for signing
        id: unsigned
        if: needs.check.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: dist/inkline-*-windows-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign the installer (waits for the release to be approved in SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'inkline' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.check.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 4500
          output-artifact-directory: signed

      - name: Use the signed installer
        if: steps.unsigned.outcome == 'success'
        run: |
          $name = "inkline-${{ needs.check.outputs.version }}-windows-setup.exe"
          $sig = Get-AuthenticodeSignature "signed/$name"
          "Signature: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { exit 1 }
          Copy-Item "signed/$name" "dist/$name" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-windows
          path: |
            dist/inkline-*-windows-setup.exe
            dist/inkline-*-windows-portable.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: windows-selftest
          path: windows-selftest/
          if-no-files-found: error
          retention-days: 7

  # check_selftest reads the PDFs with poppler's pdfinfo, which comes with Linux, not Windows
  windows-check:
    needs: [check, windows]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-selftest
          path: windows-selftest
      - name: Check the files Inkline.exe wrote
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 packaging/check_selftest.py windows-selftest/installed --install-kind windows
          python3 packaging/check_selftest.py windows-selftest/portable --install-kind windows-portable

  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }          # Apple silicon (M1 and later)
          - { arch: intel, runner: macos-15-intel }    # Intel Macs
          # both in one app, from a universal2 Python on Apple silicon: what Inkline's updater installs; its Intel
          # half is tested there too, under Rosetta
          - { arch: universal, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: matrix.arch != 'universal'
        with:
          python-version: "3.12"

      - name: Install PySide6, numpy and PyInstaller
        if: matrix.arch != 'universal'
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials==6.12.0 shiboken6==6.12.0 numpy==2.3.5 pyinstaller
          echo "PY=$(command -v python)" >> "$GITHUB_ENV"

      # PySide6's wheels are universal2; numpy's hold one processor each, so the two are joined (delocate-merge)
      - name: Install a universal2 Python (python.org's), PySide6, PyInstaller and a universal2 numpy
        if: matrix.arch == 'universal'
        run: |
          curl -fsSL -o python.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install PySide6-Essentials==6.12.0 shiboken6==6.12.0 pyinstaller delocate
          for p in arm64 x86_64; do
            "$PY" -m pip download --only-binary=:all: --no-deps --platform "macosx_14_0_$p" numpy==2.3.5 -d wheels
          done
          /Library/Frameworks/Python.framework/Versions/3.12/bin/delocate-merge wheels/numpy-*arm64.whl wheels/numpy-*x86_64.whl -w merged
          "$PY" -m pip install merged/numpy-*universal2.whl
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Build the app and its disk image
        run: |
          "$PY" packaging/macos/build.py --arch ${{ matrix.arch }}
          V=${{ needs.check.outputs.version }}
          case ${{ matrix.arch }} in universal) DMG="inkline-$V-macos.dmg" ;; *) DMG="inkline-$V-macos-${{ matrix.arch }}.dmg" ;; esac
          test -f "dist/$DMG"
          test "$(defaults read "$PWD/dist/Inkline.app/Contents/Info" CFBundleShortVersionString)" = "$V"
          codesign --verify --deep "dist/Inkline.app"
          lipo -archs dist/Inkline.app/Contents/MacOS/Inkline

      - name: Run the self-test with the built Inkline.app
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Inkline.app/Contents/MacOS/Inkline --selftest selftest/macos-${{ matrix.arch }}

      - name: Run the universal app's Intel half too (under Rosetta)
        if: matrix.arch == 'universal'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 dist/Inkline.app/Contents/MacOS/Inkline --selftest selftest/macos-rosetta

      # Help → Check for updates automatically sets up a launchd agent for the person: launchd must accept it
      - name: Set up and remove the update check's launchd agent
        if: matrix.arch == 'arm64'
        run: |
          python -c "from inkapp import update_schedule as u; import sys; e = u.apply('daily', 'macos'); print(e); sys.exit(1 if e else 0)"
          launchctl print "gui/$(id -u)/io.github.gshoe2006.Inkline.update" | head -20
          python -c "from inkapp import update_schedule as u; u.apply(None, 'macos')"
          test ! -f "$HOME/Library/LaunchAgents/io.github.gshoe2006.Inkline.update.plist"

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-macos-${{ matrix.arch }}
          path: dist/inkline-*.dmg
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: macos-selftest-${{ matrix.arch }}
          path: selftest/
          retention-days: 7

  macos-check:
    needs: [check, macos]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-selftest-*
          merge-multiple: true
          path: selftest
      - name: Check the files each Inkline.app wrote
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          for d in arm64 intel universal rosetta; do
            python3 packaging/check_selftest.py "selftest/macos-$d" --install-kind macos
          done

  release:
    needs: [check, selftest, run-and-arch, flatpak, deb, appimage, rpm, rpm-opensuse, snap, windows, windows-check, macos, macos-check]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # only the packages (artifacts named pkg-*): the self-tests' sample outputs are artifacts of this run too
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: |
          python3 packaging/release_notes.py "$V" > notes.md
          printf '\n## Code signing policy\n\nSee [Code signing policy](%s/%s/blob/main/README.md#code-signing-policy).\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> notes.md
          ls -l dist
          test "$(ls dist | wc -l)" = 16 || { echo "::error::Expected the 16 packages in dist, found: $(ls dist)"; exit 1; }
          gh release create "$V" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Inkline $V" \
            --notes-file notes.md
          echo "::notice::Published Inkline $V: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$V"

      # A release made with this workflow's token doesn't start other workflows, so
      # notify-portal.yml won't run for it: tell the portal from here instead.
      - name: Tell the app portal
        env:
          PORTAL_TOKEN: ${{ secrets.PORTAL_TOKEN }}
        run: sh packaging/notify_portal.sh --warn

  test-build-done:
    needs: [check, selftest, run-and-arch, flatpak, deb, appimage, rpm, rpm-opensuse, snap, windows, windows-check, macos, macos-check]
    if: needs.check.outputs.build == 'true' && needs.check.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Say where the packages are
        run: |
          {
            echo "### Test build of Inkline ${{ needs.check.outputs.version }} passed"
            echo
            echo "Nothing was published. The self-test passed, and all 16 packages built and passed their own"
            echo "checks. Download them under **Artifacts** below (pkg-*, kept for 7 days)."
          } >> "$GITHUB_STEP_SUMMARY"
