# Publishes a GitHub Release whenever VERSION changes on main to a version that has no release yet.
#
#   1. check    VERSION is a new version, and CHANGELOG.md has notes for it
#   2. selftest the same self-test every pull request runs (selftest.yml)
#   3. build    the .run installer and the Arch package (in Arch Linux), the .flatpak, the Debian/Ubuntu
#               .deb, the AppImage, the Windows installer and the macOS disk image
#   4. release  tags the commit, publishes "Inkline <version>" with those notes and the seven files,
#               then tells the app portal (Gshoe2006/Apps) to show it straight away
#
# Nothing is published unless every step passes. To release: in one pull request, bump VERSION and
# add a "## <version>" section to CHANGELOG.md, then merge it. "Run workflow" on the Actions tab
# releases the current VERSION if that hasn't happened yet (for example after fixing a failed build).
#
# Tick "Test build only" under Run workflow to do everything but publish: the notes check, the
# self-test and all seven builds, with the packages kept for 7 days under the run's Artifacts.
# Releases are only ever published from main.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      test_only:
        description: "Test build only: build and keep the packages, publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this a new version?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ONLY: ${{ inputs.test_only == true }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::VERSION should look like 3.4.3, not '$V'."
            exit 1
          fi
          RELEASED=false
          gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && RELEASED=true
          if [ "$TEST_ONLY" = true ]; then
            echo "::notice::Test build of Inkline $V: everything runs except publishing."
            BUILD=true PUBLISH=false
          elif [ "$RELEASED" = true ]; then
            echo "::notice::Inkline $V is already released, so there's nothing to do."
            BUILD=false PUBLISH=false
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::notice::Releases are only published from main, so this run on $GITHUB_REF_NAME builds without publishing."
            BUILD=true PUBLISH=false
          else
            BUILD=true PUBLISH=true
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Are there release notes for it?
        if: steps.version.outputs.build == 'true'
        run: |
          python3 packaging/release_notes.py > /dev/null
          V=${{ steps.version.outputs.version }}
          grep -q "<release version=\"$V\"" packaging/flatpak/io.github.gshoe2006.Inkline.metainfo.xml ||
            echo "::warning file=packaging/flatpak/io.github.gshoe2006.Inkline.metainfo.xml::No <release version=\"$V\"> entry. Flathub and app stores list releases from this file."

  selftest:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/selftest.yml

  run-and-arch:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git python

      - uses: actions/checkout@v7

      - name: Build the .run installer and the Arch package
        run: |
          # A fresh checkout gives every file the same time, so keep build.sh from redrawing the
          # icons (that needs librsvg); the committed ones are already current.
          touch inkline.svg
          # makepkg refuses to run as root
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder sh packaging/build.sh
          V=${{ needs.check.outputs.version }}
          test -f "dist/inkline-$V.run"
          ls dist/inkline-"$V"-*.pkg.tar.zst

      # Help → Check for updates installs a newer version the way this one was installed, which each package
      # records: install them here and check each says the right thing
      - name: Install the Arch package and the .run, and check how each says it was installed
        run: |
          V=${{ needs.check.outputs.version }}
          pacman -U --noconfirm dist/inkline-"$V"-*.pkg.tar.zst
          python3 packaging/check_install_kind.py /usr/share/inkline arch
          sudo -u builder sh "dist/inkline-$V.run"
          python3 packaging/check_install_kind.py /home/builder/.local/share/inkline run-user
          sh "dist/inkline-$V.run" --system
          python3 packaging/check_install_kind.py /usr/local/share/inkline run-system

      - uses: actions/upload-artifact@v7
        with:
          name: run-and-arch
          path: |
            dist/inkline-*.run
            dist/inkline-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  flatpak:
    needs: check
    if: needs.check.outputs.build == 'true'
    # flatpak-builder runs the machine's own appstreamcli on the metainfo; 24.04's is too old for it
    # ("file-read-error"), so build on the newest Ubuntu, nearer the tools Arch ships
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils   # elfutils: eu-strip, which flatpak-builder runs on the host

      - name: Build the .flatpak
        run: |
          sh packaging/flatpak/build.sh --bundle
          test -f "dist/inkline-${{ needs.check.outputs.version }}.flatpak"

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/inkline-*.flatpak
          if-no-files-found: error
          retention-days: 7

  deb:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the .deb
        run: |
          sh packaging/debian/build-deb.sh
          test -f "dist/inkline_${{ needs.check.outputs.version }}-1_amd64.deb"

      - name: Install it and run the self-test with it
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y poppler-utils "./dist/inkline_${{ needs.check.outputs.version }}-1_amd64.deb"   # poppler-utils: check_selftest reads the PDFs
          QT_QPA_PLATFORM=offscreen inkline --selftest deb-selftest
          python3 packaging/check_selftest.py deb-selftest --install-kind deb

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/inkline_*.deb
          if-no-files-found: error
          retention-days: 7

  appimage:
    needs: check
    if: needs.check.outputs.build == 'true'
    # built on the oldest supported Ubuntu, so the AppImage runs on distributions at least as new
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the AppImage
        run: |
          pip install uv
          sh packaging/appimage/build-appimage.sh
          test -f "dist/inkline-${{ needs.check.outputs.version }}-x86_64.AppImage"

      - name: Run the self-test with it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 poppler-utils   # poppler-utils: check_selftest reads the PDFs
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 \
            "./dist/inkline-${{ needs.check.outputs.version }}-x86_64.AppImage" --selftest appimage-selftest
          python3 packaging/check_selftest.py appimage-selftest --install-kind appimage

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/inkline-*.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 90   # signing waits for someone to approve the release in SignPath (see docs/code-signing.md)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PySide6, numpy, PyInstaller and Inno Setup
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials==6.12.0 shiboken6==6.12.0 numpy==2.3.5 pyinstaller
          choco install innosetup -y --no-progress

      - name: Build the app and its installer
        run: |
          python packaging/windows/build.py
          if (-not (Test-Path "dist/inkline-${{ needs.check.outputs.version }}-windows-setup.exe")) { exit 1 }
          if ((Get-Content dist/Inkline/_internal/VERSION).Trim() -ne "${{ needs.check.outputs.version }}") { exit 1 }

      - name: Run the self-test with the built Inkline.exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import subprocess, sys; sys.exit(subprocess.run([r'dist\Inkline\Inkline.exe', '--selftest', 'windows-selftest']).returncode)"

      # Help → Check for updates automatically sets these up for the person: Windows must accept them as written
      - name: Set up and remove the update check's task and login entry
        run: |
          python -c "from inkapp import update_schedule as u; import sys; e = u.apply('daily', 'windows'); print(e); sys.exit(1 if e else 0)"
          schtasks /Query /TN "Inkline update check" /XML
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "from inkapp import update_schedule as u; import sys; e = u.apply('login', 'windows'); print(e); sys.exit(1 if e else 0)"
          (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."Inkline update check"
          if (-not (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."Inkline update check") { exit 1 }
          schtasks /Query /TN "Inkline update check" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Error "the daily task should be gone"; exit 1 }
          python -c "from inkapp import update_schedule as u; u.apply(None, 'windows')"
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."Inkline update check") { exit 1 }
          $global:LASTEXITCODE = 0

      - name: Check the installer's file details
        run: |
          $exe = Get-Item "dist/inkline-${{ needs.check.outputs.version }}-windows-setup.exe"
          $info = $exe.VersionInfo
          # Inno Setup pads these with spaces (it leaves room to write them in): what counts is the text
          $name, $ver = $info.ProductName.Trim(), $info.ProductVersion.Trim()
          "Product: '$name' '$ver'"
          if ($name -ne "Inkline" -or $ver -ne "${{ needs.check.outputs.version }}") { exit 1 }

      # Signing (docs/code-signing.md): only for a release, and only once SignPath is set up for the repository
      # (the SIGNPATH_ORGANIZATION_ID variable and the SIGNPATH_API_TOKEN secret). Without them the installer
      # is published unsigned, as before.
      - name: Keep the unsigned installer for signing
        id: unsigned
        if: needs.check.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: dist/inkline-*-windows-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign the installer (waits for the release to be approved in SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'inkline' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.check.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 4500
          output-artifact-directory: signed

      - name: Use the signed installer
        if: steps.unsigned.outcome == 'success'
        run: |
          $name = "inkline-${{ needs.check.outputs.version }}-windows-setup.exe"
          $sig = Get-AuthenticodeSignature "signed/$name"
          "Signature: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { exit 1 }
          Copy-Item "signed/$name" "dist/$name" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/inkline-*-windows-setup.exe
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: windows-selftest
          path: windows-selftest/
          if-no-files-found: error
          retention-days: 7

  # check_selftest reads the PDFs with poppler's pdfinfo, which comes with Linux, not Windows
  windows-check:
    needs: [check, windows]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-selftest
          path: windows-selftest
      - name: Check the files Inkline.exe wrote
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 packaging/check_selftest.py windows-selftest --install-kind windows

  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15   # Apple silicon: the app is built for M1 and later Macs
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PySide6, numpy and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials==6.12.0 shiboken6==6.12.0 numpy==2.3.5 pyinstaller

      - name: Build the app and its disk image
        run: |
          python packaging/macos/build.py
          test -f "dist/inkline-${{ needs.check.outputs.version }}-macos.dmg"
          test "$(defaults read "$PWD/dist/Inkline.app/Contents/Info" CFBundleShortVersionString)" = "${{ needs.check.outputs.version }}"
          codesign --verify --deep "dist/Inkline.app"

      - name: Run the self-test with the built Inkline.app
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Inkline.app/Contents/MacOS/Inkline --selftest macos-selftest

      # Help → Check for updates automatically sets up a launchd agent for the person: launchd must accept it
      - name: Set up and remove the update check's launchd agent
        run: |
          python -c "from inkapp import update_schedule as u; import sys; e = u.apply('daily', 'macos'); print(e); sys.exit(1 if e else 0)"
          launchctl print "gui/$(id -u)/io.github.gshoe2006.Inkline.update" | head -20
          python -c "from inkapp import update_schedule as u; u.apply(None, 'macos')"
          test ! -f "$HOME/Library/LaunchAgents/io.github.gshoe2006.Inkline.update.plist"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/inkline-*-macos.dmg
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: macos-selftest
          path: macos-selftest/
          retention-days: 7

  macos-check:
    needs: [check, macos]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos-selftest
          path: macos-selftest
      - name: Check the files Inkline.app wrote
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 packaging/check_selftest.py macos-selftest --install-kind macos

  release:
    needs: [check, selftest, run-and-arch, flatpak, deb, appimage, windows, windows-check, macos, macos-check]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # only the packages: the self-test's sample outputs are artifacts of this run too, and aren't for the release
      - uses: actions/download-artifact@v8
        with:
          name: run-and-arch
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: flatpak
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: appimage
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
        run: |
          python3 packaging/release_notes.py "$V" > notes.md
          printf '\n## Code signing policy\n\nSee [Code signing policy](%s/%s/blob/main/README.md#code-signing-policy).\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> notes.md
          ls -l dist
          test "$(ls dist | wc -l)" = 7 || { echo "::error::Expected the 7 packages in dist, found: $(ls dist)"; exit 1; }
          gh release create "$V" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Inkline $V" \
            --notes-file notes.md
          echo "::notice::Published Inkline $V: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$V"

      # A release made with this workflow's token doesn't start other workflows, so
      # notify-portal.yml won't run for it: tell the portal from here instead.
      - name: Tell the app portal
        env:
          PORTAL_TOKEN: ${{ secrets.PORTAL_TOKEN }}
        run: sh packaging/notify_portal.sh --warn

  test-build-done:
    needs: [check, selftest, run-and-arch, flatpak, deb, appimage, windows, windows-check, macos, macos-check]
    if: needs.check.outputs.build == 'true' && needs.check.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Say where the packages are
        run: |
          {
            echo "### Test build of Inkline ${{ needs.check.outputs.version }} passed"
            echo
            echo "Nothing was published. The self-test passed, and the .run installer, the Arch package, the"
            echo ".flatpak, the .deb, the AppImage and the Windows installer built. Download them under **Artifacts**"
            echo "below (kept for 7 days)."
          } >> "$GITHUB_STEP_SUMMARY"
