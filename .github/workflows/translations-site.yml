# Publishes the translation review pages at https://gshoe2006.github.io/inkline/ with GitHub Pages, so a native
# speaker can check a language in their browser without Python: a page per language and one with every language
# (packaging/translation_sheet.py's web page, with search, filters and a box for a better wording on each row), and
# an index page linking them with how many strings in each still need review.
#
# Once, by the repository's owner: Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (docs/translating.md). Until then the deploy step fails; nothing else depends on it.
name: Translation review site

on:
  push:
    branches: [main]
    paths:
      - "inkengine/locale/**"
      - "packaging/translations/**"
      - "packaging/translation_sheet.py"
      - "inkengine/patterns/**"        # the word lists the review pages list too
      - "inkengine/pictures.py"        # the memory cards' picture words
      - ".github/workflows/translations-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false            # let a deploy that has started finish

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo grep -ls packages.microsoft.com /etc/apt/sources.list.d/* | xargs -r sudo rm -f || true   # its apt source returns 403 at times; nothing here needs it
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Install PySide6 and numpy (the versions the packages ship)
        run: python -m pip install --disable-pip-version-check PySide6-Essentials==6.12.0 shiboken6==6.12.0 numpy==2.3.5

      - name: Write the review pages
        run: python packaging/translation_sheet.py site _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
