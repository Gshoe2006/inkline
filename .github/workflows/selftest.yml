# Runs Inkline's headless self-test on every pull request and every push to main.
# The self-test opens the window and writes every pattern, the photo styles, a booklet, two posters and a
# photo book through the app's own save code; check_selftest.py then inspects the files it wrote.
name: Self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:         # release.yml runs this before it publishes a release

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when release.yml calls this, so the two runs on a
  # release push don't cancel each other
  group: selftest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-24.04
    # the job takes about 17 minutes (15 of them the tests); installing can take 5 on a slow runner
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core poppler-utils

      - name: Install PySide6 (same version as Arch ships) and numpy
        run: python -m pip install --disable-pip-version-check PySide6==6.12.0 numpy

      - name: Test the 3.0 engine (inkengine/)
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests --durations=15   # the slowest tests, for when the job gets slow

      - name: Run the self-test
        # runner.temp is only available inside steps, not in job-level env
        env:
          INKLINE_CONFIG_DIR: ${{ runner.temp }}/inkline-config
        run: python inkline.py --selftest selftest-output

      - name: Check the self-test's files
        run: python packaging/check_selftest.py selftest-output

      - name: Build the universal installer and smoke-test it
        run: |
          packaging/build.sh
          export HOME="$RUNNER_TEMP/fakehome" && mkdir -p "$HOME"
          sh dist/inkline-*.run
          test -x "$HOME/.local/bin/inkline"
          test -f "$HOME/.local/share/applications/inkline.desktop"
          sh "$HOME/.local/share/inkline/uninstall.sh"
          test ! -e "$HOME/.local/share/inkline"

      - name: Keep the rendered files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-output
          path: selftest-output/
          retention-days: 7
          if-no-files-found: warn
