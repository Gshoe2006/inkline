<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inkline</title>
<style>
/* Layout: fixed control rail on the left, a "light table" on the right holding a true-to-scale sheet of paper. */
:root {
  --bg: #eceff2;
  --panel: #ffffff;
  --ink: #16181d;
  --muted: #5b626e;
  --line: #d3d8de;
  --accent: #0b7ea6;      /* process cyan, darkened for contrast */
  --accent-ink: #ffffff;
  --table: #d9dee4;
  --field: #f5f7f9;
  --font-ui: "Inter", "Cantarell", "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --font-head: "Space Grotesk", "Inter", "Cantarell", "Noto Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --panel: #1a1d22; --ink: #e7e9ed; --muted: #9aa2ad; --line: #2d323a;
    --accent: #4dc2e6; --accent-ink: #06222c; --table: #0b0d10; --field: #22262c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --panel: #1a1d22; --ink: #e7e9ed; --muted: #9aa2ad; --line: #2d323a;
  --accent: #4dc2e6; --accent-ink: #06222c; --table: #0b0d10; --field: #22262c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); display: flex; overflow: hidden; }

aside { width: 330px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font: 700 20px/1 var(--font-head); margin: 0; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 12px; }
.scroll { overflow-y: auto; flex: 1; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 18px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 600 13px var(--font-ui); padding: 8px; border-radius: 6px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
legend { font: 600 11px var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; padding: 0; }
.row { display: flex; flex-direction: column; gap: 4px; }
.row label, .check { font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.row output { font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
select, .btn { font: 13px var(--font-ui); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.check { justify-content: flex-start; align-items: center; cursor: pointer; }
.check input { accent-color: var(--accent); }
.btn { cursor: pointer; text-align: center; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seedline { display: flex; gap: 8px; align-items: center; }
.seedline code { font: 12px var(--font-mono); color: var(--muted); flex: 1; }
.seedline .btn { width: auto; padding: 7px 14px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
input[type="text"], input[type="number"] { font: 13px var(--font-ui); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; }
.sub { display: flex; flex-direction: column; gap: 10px; padding-left: 12px; border-left: 2px solid var(--line); }
.pager { display: flex; align-items: center; gap: 8px; }
.pager .btn { width: auto; padding: 5px 12px; }
.pager span { flex: 1; text-align: center; font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
.drop strong { color: var(--ink); font-weight: 600; word-break: break-all; }
.drop .pair .btn { padding: 6px; }

.foot { border-top: 1px solid var(--line); padding: 14px 20px; display: flex; flex-direction: column; gap: 8px; }
.foot .pair { gap: 8px; }
#msg { font-size: 12px; color: var(--muted); min-height: 1.4em; }

main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--table); }
.bar { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 18px; font: 12px var(--font-mono); color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg); font-variant-numeric: tabular-nums; }
.bar b { color: var(--ink); font-weight: 600; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; }
.stage.over { outline: 3px dashed var(--accent); outline-offset: -12px; }
#page { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2), 0 8px 30px rgb(0 0 0 / .18); }
#busy { position: absolute; top: 34px; right: 34px; font: 12px var(--font-mono); background: var(--panel); color: var(--muted); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }

@media (max-width: 760px) {
  body { flex-direction: column; overflow: auto; }
  aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
  .stage { min-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<aside>
  <div class="brand"><h1>Inkline</h1><span>black &amp; white for print</span></div>
  <div class="scroll">
    <div class="tabs" role="tablist">
      <button id="tab-make" role="tab" aria-selected="true">Make one up</button>
      <button id="tab-convert" role="tab" aria-selected="false">Convert a photo</button>
    </div>

    <div id="panel-make" class="stack">
    <fieldset>
      <legend>Design</legend>
      <div class="row"><label for="gen">Pattern</label>
        <select id="gen">
          <option value="mandala">Mandala (colouring page)</option>
          <option value="maze">Maze</option>
          <option value="truchet">Woven tiles</option>
          <option value="contour">Topographic contours</option>
          <option value="flow">Flow lines</option>
        </select></div>
      <div class="row"><label for="complexity">Complexity <output id="complexity-o"></output></label><input type="range" id="complexity" min="1" max="10" value="5"></div>
      <div class="row"><label for="weight">Line weight <output id="weight-o"></output></label><input type="range" id="weight" min="1" max="10" value="4"></div>
      <label class="check"><input type="checkbox" id="frame"> Draw a border around the design</label>
      <div class="seedline"><code id="seed-o"></code><button class="btn primary" id="reroll">New design</button></div>
    </fieldset>

    <fieldset>
      <legend>Page text</legend>
      <div class="row"><label for="title">Title</label><input type="text" id="title" maxlength="60" placeholder="e.g. Rainy Day Mazes"></div>
      <label class="check"><input type="checkbox" id="nameLine"> Add a "Name ______" line</label>
    </fieldset>

    <fieldset>
      <legend>Booklet</legend>
      <label class="check"><input type="checkbox" id="booklet"> Make a multi-page booklet</label>
      <div class="sub" id="book-opts" hidden>
        <div class="row"><label for="pages">Design pages <output id="pages-o"></output></label><input type="range" id="pages" min="2" max="40" value="10"></div>
        <label class="check"><input type="checkbox" id="ramp" checked> Get harder page by page</label>
        <label class="check"><input type="checkbox" id="mix"> Mix all five patterns</label>
        <label class="check"><input type="checkbox" id="cover" checked> Cover page</label>
        <label class="check"><input type="checkbox" id="pageNums" checked> Page numbers</label>
        <label class="check"><input type="checkbox" id="key" checked> Answer pages for mazes</label>
        <div class="pager"><button class="btn" id="prev" aria-label="Previous page">‹</button><span id="pagepos"></span><button class="btn" id="next" aria-label="Next page">›</button></div>
        <p class="hint">Save PDF and Print use every page. Save PNG saves the page shown.</p>
      </div>
    </fieldset>
    </div>

    <fieldset id="panel-convert" hidden>
      <legend>Photo</legend>
      <div class="drop" id="drop">
        <span id="srcname">Drop an image anywhere, paste one, or</span>
        <div class="pair"><label class="btn" for="file">Open image…</label><button class="btn" id="sample">Use sample</button></div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="row"><label for="style">Style</label>
        <select id="style">
          <option value="fs">Dither: smooth (Floyd–Steinberg)</option>
          <option value="atkinson">Dither: crisp (Atkinson)</option>
          <option value="bayer">Dither: pattern (ordered)</option>
          <option value="halftone">Halftone dots</option>
          <option value="threshold">Solid black &amp; white</option>
          <option value="line">Line drawing (colouring page)</option>
        </select></div>
      <div class="row"><label for="brightness">Brightness <output id="brightness-o"></output></label><input type="range" id="brightness" min="-100" max="100" value="0"></div>
      <div class="row"><label for="contrast">Contrast <output id="contrast-o"></output></label><input type="range" id="contrast" min="20" max="300" value="110"></div>
      <div class="row"><label for="threshold">Threshold / detail <output id="threshold-o"></output></label><input type="range" id="threshold" min="1" max="254" value="128"></div>
      <div class="row"><label for="dot">Dot size <output id="dot-o"></output></label><input type="range" id="dot" min="1" max="8" value="2"></div>
      <div class="pair">
        <div class="row"><label for="fit">Placement</label><select id="fit"><option value="contain">Fit inside</option><option value="cover">Fill page</option></select></div>
        <div class="row"><label for="invert">&nbsp;</label><label class="check"><input type="checkbox" id="invert"> Invert</label></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Paper</legend>
      <div class="pair">
        <div class="row"><label for="paper">Size</label><select id="paper"><option value="letter">Letter</option><option value="a4">A4</option></select></div>
        <div class="row"><label for="orient">Orientation</label><select id="orient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div>
      </div>
      <div class="pair">
        <div class="row"><label for="margin">Margin</label><select id="margin"><option value="0.25">¼ in</option><option value="0.5" selected>½ in</option><option value="0.75">¾ in</option><option value="1">1 in</option></select></div>
        <div class="row"><label for="dpi">Resolution</label><select id="dpi"><option value="150">150 dpi (draft)</option><option value="300" selected>300 dpi</option></select></div>
      </div>
    </fieldset>
  </div>
  <div class="foot">
    <button class="btn primary" id="print">Print…</button>
    <div class="pair"><button class="btn" id="save-png">Save PNG</button><button class="btn" id="save-pdf">Save PDF</button></div>
    <div id="msg" role="status"></div>
  </div>
</aside>
<main>
  <div class="bar" id="bar"></div>
  <div class="stage" id="stage"><canvas id="page" width="850" height="1100"></canvas><div id="busy" hidden>rendering…</div></div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const page = $("page"), pctx = page.getContext("2d");
const PAPER = { letter: [8.5, 11], a4: [8.27, 11.69] };
const S = { mode: "make", seed: (Math.random() * 1e9) | 0, img: null, imgName: "", bookPage: 0 };

/* ---------- helpers ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeNoise(seed) {
  const r = mulberry32(seed), perm = new Uint8Array(256), vals = new Float32Array(256);
  for (let i = 0; i < 256; i++) { perm[i] = i; vals[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const lat = (x, y) => vals[perm[(perm[x & 255] + y) & 255]];
  const n = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = lat(xi, yi), b = lat(xi + 1, yi), c = lat(xi, yi + 1), d = lat(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  return (x, y) => { let s = 0, amp = 0.5, f = 1, norm = 0; for (let o = 0; o < 4; o++) { s += amp * n(x * f + o * 17.3, y * f - o * 9.1); norm += amp; amp *= 0.5; f *= 2; } return s / norm; };
}
const v = id => $(id).type === "checkbox" ? $(id).checked : $(id).value;
const num = id => +$(id).value;

function geometry() {
  let [w, h] = PAPER[v("paper")]; if (v("orient") === "landscape") [w, h] = [h, w];
  const dpi = num("dpi"), m = +v("margin") * dpi;
  const W = Math.round(w * dpi), H = Math.round(h * dpi);
  return { w, h, dpi, W, H, box: { x: m, y: m, w: W - 2 * m, h: H - 2 * m } };
}

/* ---------- generators ---------- */
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); }

function genMandala(ctx, box, rnd, cx_, lw) {
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2, R = Math.min(box.w, box.h) / 2 - lw;
  const P = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const rings = 3 + Math.round(cx_ * 1.1), r0 = R * 0.09;
  const ws = Array.from({ length: rings }, () => 0.6 + rnd() * 0.8), tot = ws.reduce((a, b) => a + b, 0);
  const motifs = ["petal", "circle", "scallop", "zigzag", "dots", "spokes", "teardrop"];
  const base = [6, 8, 10, 12][(rnd() * 4) | 0];
  // centre
  circle(ctx, cx, cy, r0); circle(ctx, cx, cy, r0 * 0.35);
  for (let k = 0; k < base; k++) { const a = k * 2 * Math.PI / base, h = Math.PI / base; ctx.beginPath(); ctx.moveTo(...P(r0 * 0.35, a - h)); ctx.quadraticCurveTo(...P(r0 * 1.15, a), ...P(r0 * 0.35, a + h)); ctx.stroke(); }
  let r1 = r0, last = "";
  for (let i = 0; i < rings; i++) {
    const r2 = r1 + (R - r0) * ws[i] / tot, rm = (r1 + r2) / 2, d = r2 - r1;
    let m; do { m = motifs[(rnd() * motifs.length) | 0]; } while (m === last); last = m;
    const target = 2 * Math.PI * rm / d * (0.8 + rnd() * 0.8);
    const n = Math.max(base, Math.round(target / base) * base), h = Math.PI / n;
    for (let k = 0; k < n; k++) {
      const a = k * 2 * h;
      ctx.beginPath();
      if (m === "petal") {
        ctx.moveTo(...P(r1, a - h * 0.95));
        ctx.bezierCurveTo(...P(r1 + d * 0.5, a - h * 1.05), ...P(r2, a - h * 0.35), ...P(r2, a));
        ctx.bezierCurveTo(...P(r2, a + h * 0.35), ...P(r1 + d * 0.5, a + h * 1.05), ...P(r1, a + h * 0.95));
        ctx.moveTo(...P(r1, a - h * 0.45));
        ctx.quadraticCurveTo(...P(r1 + d * 0.55, a - h * 0.4), ...P(r1 + d * 0.72, a));
        ctx.quadraticCurveTo(...P(r1 + d * 0.55, a + h * 0.4), ...P(r1, a + h * 0.45));
        ctx.stroke();
      } else if (m === "circle") {
        const rad = Math.min(d / 2, rm * Math.sin(h)) * 0.82;
        circle(ctx, ...P(rm, a), rad); circle(ctx, ...P(rm, a), rad * 0.45);
      } else if (m === "scallop") {
        ctx.moveTo(...P(r1, a - h)); ctx.quadraticCurveTo(...P(2 * r2 - r1, a), ...P(r1, a + h));
        ctx.moveTo(...P(r1, a - h * 0.6)); ctx.quadraticCurveTo(...P(r1 + d * 1.1, a), ...P(r1, a + h * 0.6));
        ctx.stroke();
      } else if (m === "zigzag") {
        ctx.moveTo(...P(r1, a - h)); ctx.lineTo(...P(r2, a)); ctx.lineTo(...P(r1, a + h)); ctx.stroke();
        circle(ctx, ...P(r1 + d * 0.32, a), Math.min(d * 0.12, rm * h * 0.3));
      } else if (m === "dots") {
        circle(ctx, ...P(rm, a), Math.min(d / 2, rm * Math.sin(h)) * 0.55);
        circle(ctx, ...P(r1 + d * 0.22, a + h), Math.min(d, rm * h) * 0.12);
        circle(ctx, ...P(r2 - d * 0.22, a + h), Math.min(d, rm * h) * 0.12);
      } else if (m === "spokes") {
        ctx.moveTo(...P(r1, a)); ctx.lineTo(...P(r2, a));
        ctx.moveTo(...P(r1 + d * 0.3, a + h * 0.35)); ctx.lineTo(...P(r1 + d * 0.3, a + h * 1.65));
        ctx.stroke();
        circle(ctx, ...P(r1 + d * 0.65, a + h), Math.min(d * 0.18, rm * h * 0.45));
      } else {
        const tip = P(r2 - lw, a);
        ctx.moveTo(...tip);
        ctx.bezierCurveTo(...P(rm, a - h * 0.25), ...P(r1, a - h * 0.95), ...P(r1 + d * 0.1, a));
        ctx.bezierCurveTo(...P(r1, a + h * 0.95), ...P(rm, a + h * 0.25), ...tip);
        ctx.stroke();
      }
    }
    circle(ctx, cx, cy, r2);
    if (rnd() < 0.35 && d > lw * 8) circle(ctx, cx, cy, r2 - lw * 3);
    r1 = r2;
  }
}

// Grid size for a maze in a given box. Answer keys reuse the puzzle page's grid so they draw the same maze.
function mazeGrid(box, c) { const cols = 8 + c * 5; return { cols, rows: Math.max(2, Math.floor(box.h / (box.w / cols))) }; }

function genMaze(ctx, box, rnd, c, opts = {}) {
  const { cols, rows } = opts.grid || mazeGrid(box, c), cs = Math.min(box.w / cols, box.h / rows);
  const ox = box.x + (box.w - cols * cs) / 2, oy = box.y + (box.h - rows * cs) / 2;
  const E = new Uint8Array(cols * rows).fill(1), Sw = new Uint8Array(cols * rows).fill(1), seen = new Uint8Array(cols * rows);
  const parent = new Int32Array(cols * rows).fill(-1);   // carving tree: following parents from any cell leads to the entrance
  const stack = [0]; seen[0] = 1;
  while (stack.length) {
    const cur = stack[stack.length - 1], x = cur % cols, y = (cur / cols) | 0, nb = [];
    if (x > 0 && !seen[cur - 1]) nb.push(cur - 1);
    if (x < cols - 1 && !seen[cur + 1]) nb.push(cur + 1);
    if (y > 0 && !seen[cur - cols]) nb.push(cur - cols);
    if (y < rows - 1 && !seen[cur + cols]) nb.push(cur + cols);
    if (!nb.length) { stack.pop(); continue; }
    const nx = nb[(rnd() * nb.length) | 0];
    if (nx === cur + 1) E[cur] = 0; else if (nx === cur - 1) E[nx] = 0; else if (nx === cur + cols) Sw[cur] = 0; else Sw[nx] = 0;
    seen[nx] = 1; parent[nx] = cur; stack.push(nx);
  }
  if (opts.solve) {   // answer key: walk parents from the exit cell back to the entrance, drawn in grey under the walls
    const centre = i => [ox + (i % cols + 0.5) * cs, oy + (((i / cols) | 0) + 0.5) * cs];
    ctx.save(); ctx.strokeStyle = "#8a8a8a"; ctx.lineWidth = cs * 0.38; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(ox + cs * 1.5 + cols * cs - cs, oy + rows * cs - cs / 2);   // off the exit edge
    for (let i = cols * rows - 1; i !== -1; i = parent[i]) ctx.lineTo(...centre(i));
    ctx.lineTo(ox + cs / 2, oy - cs / 2);                                                 // off the entrance edge
    ctx.stroke(); ctx.restore();
  }
  ctx.lineCap = "square"; ctx.beginPath();
  ctx.moveTo(ox + cs, oy); ctx.lineTo(ox + cols * cs, oy); ctx.lineTo(ox + cols * cs, oy + rows * cs - cs);   // gap = exit bottom-right
  ctx.moveTo(ox + cols * cs - cs, oy + rows * cs); ctx.lineTo(ox, oy + rows * cs); ctx.lineTo(ox, oy + cs);   // gap = entrance top-left
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x, X = ox + x * cs, Y = oy + y * cs;
    if (E[i] && x < cols - 1) { ctx.moveTo(X + cs, Y); ctx.lineTo(X + cs, Y + cs); }
    if (Sw[i] && y < rows - 1) { ctx.moveTo(X, Y + cs); ctx.lineTo(X + cs, Y + cs); }
  }
  ctx.stroke();
}

function genTruchet(ctx, box, rnd, c) {
  const s = box.w / (3 + c * 1.5), cols = Math.ceil(box.w / s), rows = Math.ceil(box.h / s);
  ctx.save(); ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip();
  const radii = c > 3 ? [0.3, 0.5, 0.7] : [0.5];
  ctx.beginPath();
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const X = box.x + x * s, Y = box.y + y * s, flip = rnd() < 0.5;
    for (const k of radii) {
      const r = k * s;
      if (flip) {
        ctx.moveTo(X + r, Y); ctx.arc(X, Y, r, 0, Math.PI / 2);
        ctx.moveTo(X + s - r, Y + s); ctx.arc(X + s, Y + s, r, Math.PI, Math.PI * 1.5);
      } else {
        ctx.moveTo(X + s, Y + r); ctx.arc(X + s, Y, r, Math.PI / 2, Math.PI);
        ctx.moveTo(X + r, Y + s); ctx.arc(X, Y + s, r, 0, -Math.PI / 2, true);
      }
    }
  }
  ctx.stroke(); ctx.restore();
}

function genContour(ctx, box, rnd, c, lw, dpi, seed) {
  const noise = makeNoise(seed), step = Math.max(3, Math.round(dpi / 45)), f = 1 / (Math.max(box.w, box.h) * 0.32);
  const cols = Math.ceil(box.w / step) + 1, rows = Math.ceil(box.h / step) + 1, F = new Float32Array(cols * rows);
  let lo = 1, hi = 0;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) { const z = noise(i * step * f, j * step * f); F[j * cols + i] = z; if (z < lo) lo = z; if (z > hi) hi = z; }
  const levels = 8 + c * 3;
  const T = { 1: [["L", "B"]], 2: [["B", "R"]], 3: [["L", "R"]], 4: [["T", "R"]], 5: [["T", "R"], ["L", "B"]], 6: [["T", "B"]], 7: [["L", "T"]], 8: [["L", "T"]], 9: [["T", "B"]], 10: [["L", "T"], ["B", "R"]], 11: [["T", "R"]], 12: [["L", "R"]], 13: [["B", "R"]], 14: [["L", "B"]] };
  ctx.save(); ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip();
  for (let k = 0; k < levels; k++) {
    const L = lo + (hi - lo) * (k + 0.5) / levels;
    ctx.lineWidth = k % 5 === 4 ? lw * 2 : lw;           // every fifth line is an index contour, like a real topo map
    ctx.beginPath();
    for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
      const a = F[j * cols + i], b = F[j * cols + i + 1], cc = F[(j + 1) * cols + i + 1], d = F[(j + 1) * cols + i];
      const idx = (a > L ? 8 : 0) | (b > L ? 4 : 0) | (cc > L ? 2 : 0) | (d > L ? 1 : 0);
      if (idx === 0 || idx === 15) continue;
      const x0 = box.x + i * step, y0 = box.y + j * step;
      const pt = e => e === "T" ? [x0 + step * (L - a) / (b - a), y0] : e === "R" ? [x0 + step, y0 + step * (L - b) / (cc - b)]
        : e === "B" ? [x0 + step * (L - d) / (cc - d), y0 + step] : [x0, y0 + step * (L - a) / (d - a)];
      for (const [p, q] of T[idx]) { ctx.moveTo(...pt(p)); ctx.lineTo(...pt(q)); }
    }
    ctx.stroke();
  }
  ctx.restore();
}

function genFlow(ctx, box, rnd, c, seed) {
  const noise = makeNoise(seed), f = 1 / (Math.max(box.w, box.h) * 0.45);
  const sep = box.w / (16 + c * 5), cs = sep * 0.5, gw = Math.ceil(box.w / cs) + 1, gh = Math.ceil(box.h / cs) + 1;
  const occ = new Int32Array(gw * gh).fill(-1), stepLen = sep * 0.25;
  const cell = (x, y) => [((x - box.x) / cs) | 0, ((y - box.y) / cs) | 0];
  const blocked = (x, y, id) => { const [gx, gy] = cell(x, y); for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const X = gx + dx, Y = gy + dy; if (X < 0 || Y < 0 || X >= gw || Y >= gh) continue; const o = occ[Y * gw + X]; if (o !== -1 && o !== id) return true; } return false; };
  const inside = (x, y) => x >= box.x && y >= box.y && x <= box.x + box.w && y <= box.y + box.h;
  const trace = (x, y, dir, id) => { const pts = []; for (let s = 0; s < 800; s++) { if (!inside(x, y) || blocked(x, y, id)) break; pts.push([x, y]); const a = noise(x * f, y * f) * Math.PI * 4; x += Math.cos(a) * stepLen * dir; y += Math.sin(a) * stepLen * dir; } return pts; };
  const seeds = [];
  for (let y = box.y + sep / 2; y < box.y + box.h; y += sep) for (let x = box.x + sep / 2; x < box.x + box.w; x += sep) seeds.push([x + (rnd() - 0.5) * sep, y + (rnd() - 0.5) * sep]);
  for (let i = seeds.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [seeds[i], seeds[j]] = [seeds[j], seeds[i]]; }
  ctx.lineJoin = "round"; ctx.lineCap = "round"; let id = 0;
  for (const [sx, sy] of seeds) {
    if (!inside(sx, sy) || blocked(sx, sy, id)) continue;
    const pts = trace(sx, sy, -1, id).reverse().concat(trace(sx, sy, 1, id).slice(1));
    if (pts.length < 10) continue;
    for (const [x, y] of pts) { const [gx, gy] = cell(x, y); if (gx >= 0 && gy >= 0 && gx < gw && gy < gh) occ[gy * gw + gx] = id; }
    ctx.beginPath(); ctx.moveTo(...pts[0]); for (const p of pts) ctx.lineTo(...p); ctx.stroke(); id++;
  }
}

/* ---------- photo conversion ---------- */
const BAYER = (() => { const m = [[0, 2], [3, 1]]; let b = m; for (let n = 2; n < 8; n *= 2) { const nb = []; for (let y = 0; y < n * 2; y++) { nb.push([]); for (let x = 0; x < n * 2; x++) nb[y].push(4 * b[y % n][x % n] + m[(y / n) | 0][(x / n) | 0]); } b = nb; } return b; })();

function convert(ctx, box) {
  if (!S.img) {
    ctx.fillStyle = "#888"; ctx.font = `${box.w / 28}px sans-serif`; ctx.textAlign = "center";
    ctx.fillText("Open or drop an image to convert it", box.x + box.w / 2, box.y + box.h / 2); return;
  }
  const style = v("style"), dot = num("dot"), cell = style === "halftone" ? dot * 5 : dot;
  const ww = Math.max(1, Math.round(box.w / cell)), wh = Math.max(1, Math.round(box.h / cell));
  const wc = document.createElement("canvas"); wc.width = ww; wc.height = wh;
  const wx = wc.getContext("2d", { willReadFrequently: true });
  const iw = S.img.width, ih = S.img.height, sc = v("fit") === "cover" ? Math.max(ww / iw, wh / ih) : Math.min(ww / iw, wh / ih);
  const dw = iw * sc, dh = ih * sc; wx.drawImage(S.img, (ww - dw) / 2, (wh - dh) / 2, dw, dh);
  const id = wx.getImageData(0, 0, ww, wh), D = id.data, N = ww * wh;
  const lum = new Float32Array(N), mask = new Uint8Array(N);
  const br = num("brightness") * 1.28, ct = num("contrast") / 100;
  for (let i = 0; i < N; i++) {
    const a = D[i * 4 + 3] / 255; mask[i] = a > 0.02;
    let y = (0.2126 * D[i * 4] + 0.7152 * D[i * 4 + 1] + 0.0722 * D[i * 4 + 2]) * a + 255 * (1 - a);
    lum[i] = (y - 128) * ct + 128 + br;
  }
  const t = num("threshold"), inv = v("invert"), out = new Uint8Array(N).fill(255);
  if (style === "threshold") for (let i = 0; i < N; i++) out[i] = lum[i] < t ? 0 : 255;
  else if (style === "bayer") for (let y = 0; y < wh; y++) for (let x = 0; x < ww; x++) { const i = y * ww + x; out[i] = lum[i] < (BAYER[y & 7][x & 7] + 0.5) * 4 + (t - 128) ? 0 : 255; }
  else if (style === "fs" || style === "atkinson") {
    const L = lum.slice(), atk = style === "atkinson";
    for (let y = 0; y < wh; y++) for (let k = 0; k < ww; k++) {
      const s = y & 1 ? -1 : 1, x = s > 0 ? k : ww - 1 - k;   // serpentine scan avoids directional streaks
      const i = y * ww + x, o = L[i] < t ? 0 : 255, e = L[i] - o; out[i] = o;
      const add = (dx, dy, w) => { const X = x + dx * s, Y = y + dy; if (X >= 0 && X < ww && Y < wh) L[Y * ww + X] += e * w; };
      if (atk) { const w = 1 / 8; add(1, 0, w); add(2, 0, w); add(-1, 1, w); add(0, 1, w); add(1, 1, w); add(0, 2, w); }
      else { add(1, 0, 7 / 16); add(-1, 1, 3 / 16); add(0, 1, 5 / 16); add(1, 1, 1 / 16); }
    }
  } else if (style === "line") {
    const B = new Float32Array(N);   // 3x3 box blur, then Sobel edges
    for (let y = 0; y < wh; y++) for (let x = 0; x < ww; x++) { let s = 0, c = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < ww && Y < wh) { s += lum[Y * ww + X]; c++; } } B[y * ww + x] = s / c; }
    const edge = 260 - t;
    for (let y = 1; y < wh - 1; y++) for (let x = 1; x < ww - 1; x++) {
      const p = (dx, dy) => B[(y + dy) * ww + x + dx];
      const gx = -p(-1, -1) - 2 * p(-1, 0) - p(-1, 1) + p(1, -1) + 2 * p(1, 0) + p(1, 1);
      const gy = -p(-1, -1) - 2 * p(0, -1) - p(1, -1) + p(-1, 1) + 2 * p(0, 1) + p(1, 1);
      out[y * ww + x] = Math.hypot(gx, gy) > edge ? 0 : 255;
    }
  }
  if (style === "halftone") {
    const sx = box.w / ww, sy = box.h / wh, rmax = Math.max(sx, sy) * 0.72;
    ctx.save(); ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip(); ctx.fillStyle = "#000";
    for (let y = 0; y < wh; y++) for (let x = 0; x < ww; x++) {
      const i = y * ww + x; if (!mask[i]) continue;
      let dark = 1 - Math.min(255, Math.max(0, lum[i])) / 255; if (inv) dark = 1 - dark;
      if (dark < 0.03) continue;
      ctx.beginPath(); ctx.arc(box.x + (x + 0.5) * sx, box.y + (y + 0.5) * sy, rmax * Math.sqrt(dark), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore(); return;
  }
  for (let i = 0; i < N; i++) {
    let o = mask[i] ? out[i] : 255; if (inv && mask[i]) o = 255 - o;
    D[i * 4] = D[i * 4 + 1] = D[i * 4 + 2] = o; D[i * 4 + 3] = 255;
  }
  wx.putImageData(id, 0, 0);
  ctx.imageSmoothingEnabled = false; ctx.drawImage(wc, box.x, box.y, box.w, box.h); ctx.imageSmoothingEnabled = true;
}

/* ---------- render ---------- */
/* ---------- pages & booklets ---------- */
const GENS = ["mandala", "maze", "truchet", "contour", "flow"];
const GEN_NAMES = { mandala: "Mandala", maze: "Maze", truchet: "Woven tiles", contour: "Contours", flow: "Flow lines" };
const FONT = '"Cantarell", "Noto Sans", "Inter", sans-serif';
const inset = (b, p) => ({ x: b.x + p, y: b.y + p, w: b.w - 2 * p, h: b.h - 2 * p });

// Where the design goes once header and footer bands are taken out. Pure, so answer keys can recompute a page's grid.
function designBox(g, spec) {
  const b = { ...g.box }, band = g.dpi * 0.5;
  if (spec.header) { b.y += band; b.h -= band; }
  if (spec.pageNo) b.h -= band * 0.6;
  return v("frame") ? inset(b, num("weight") * g.dpi / 150 * 7.6) : b;
}

function drawBands(ctx, g, spec) {
  const b = g.box, fs = g.dpi * 0.22;
  ctx.save(); ctx.fillStyle = "#000"; ctx.textBaseline = "alphabetic";
  if (spec.header) {
    const y = b.y + fs;
    if (spec.title) { ctx.font = `700 ${fs}px ${FONT}`; ctx.textAlign = "left"; ctx.fillText(spec.title, b.x, y, b.w * (spec.name ? 0.55 : 1)); }
    if (spec.name) {
      ctx.font = `400 ${fs * 0.75}px ${FONT}`; ctx.textAlign = "left";
      const lx = b.x + b.w * 0.6, label = "Name"; ctx.fillText(label, lx, y);
      ctx.lineWidth = g.dpi / 150; ctx.beginPath(); ctx.moveTo(lx + ctx.measureText(label).width + fs * 0.3, y + 2); ctx.lineTo(b.x + b.w, y + 2); ctx.stroke();
    }
    if (spec.label) { ctx.font = `400 ${fs * 0.6}px ${FONT}`; ctx.textAlign = "left"; ctx.fillStyle = "#555"; ctx.fillText(spec.label, b.x, y + fs * 0.85); }
  }
  if (spec.pageNo) { ctx.font = `400 ${fs * 0.6}px ${FONT}`; ctx.fillStyle = "#333"; ctx.textAlign = "center"; ctx.fillText(String(spec.pageNo), b.x + b.w / 2, b.y + b.h - fs * 0.1); }
  ctx.restore();
}

function drawDesign(ctx, g, box, gen, seed, c, lw, opts) {
  const rnd = mulberry32(seed);
  if (gen === "mandala") genMandala(ctx, box, rnd, c, lw);
  else if (gen === "maze") genMaze(ctx, box, rnd, c, opts);
  else if (gen === "truchet") genTruchet(ctx, box, rnd, c);
  else if (gen === "contour") genContour(ctx, box, rnd, c, lw, g.dpi, seed);
  else genFlow(ctx, box, rnd, c, seed);
}

// Describes every page of the booklet; the preview, Save PDF and Print all walk this same list.
function bookPages() {
  const n = num("pages"), c = num("complexity"), title = $("title").value.trim(), mix = v("mix"), ramp = v("ramp");
  const name = v("nameLine"), nums = v("pageNums"), pages = [], designs = [];
  for (let i = 0; i < n; i++) {
    const gen = mix ? GENS[i % GENS.length] : v("gen");
    const cx = ramp && n > 1 ? Math.round(1 + (Math.max(c, 2) - 1) * i / (n - 1)) : c;
    designs.push({ kind: "design", gen, seed: (S.seed + i * 7919) >>> 0, c: cx, title, name, header: !!(title || name), label: `${GEN_NAMES[gen]} ${i + 1}` });
  }
  if (v("cover")) pages.push({ kind: "cover", title: title || (mix ? "Colouring & puzzle book" : GEN_NAMES[v("gen")] + " book"), designs });
  pages.push(...designs);
  const mazes = designs.filter(d => d.gen === "maze");
  if (v("key")) for (let i = 0; i < mazes.length; i += 4) pages.push({ kind: "answers", header: true, title: "Answers", items: mazes.slice(i, i + 4) });
  let no = 1; for (const p of pages) if (p.kind !== "cover" && nums) p.pageNo = no++;
  return pages;
}

function singlePage() {
  const title = $("title").value.trim(), name = v("nameLine");
  return { kind: "design", gen: v("gen"), seed: S.seed, c: num("complexity"), title, name, header: !!(title || name) };
}

function drawPage(ctx, g, spec) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, g.W, g.H);
  ctx.strokeStyle = "#000"; ctx.fillStyle = "#000"; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const lw = num("weight") * g.dpi / 150; ctx.lineWidth = lw;
  if (spec.kind === "photo") { convert(ctx, g.box); return; }
  drawBands(ctx, g, spec);
  if (spec.kind === "design") {
    const box = designBox(g, spec);
    if (v("frame")) { ctx.lineWidth = lw * 1.6; ctx.strokeRect(...Object.values(inset(box, -lw * 6))); ctx.lineWidth = lw; }
    drawDesign(ctx, g, box, spec.gen, spec.seed, spec.c, lw);
  } else if (spec.kind === "answers") {
    const area = designBox(g, spec), gap = g.dpi * 0.3, cw = (area.w - gap) / 2, ch = (area.h - gap) / 2, fs = g.dpi * 0.14;
    spec.items.forEach((d, k) => {
      const cell = { x: area.x + (k % 2) * (cw + gap), y: area.y + ((k / 2) | 0) * (ch + gap), w: cw, h: ch };
      ctx.save(); ctx.font = `600 ${fs}px ${FONT}`; ctx.fillStyle = "#000"; ctx.textAlign = "left";
      ctx.fillText(d.pageNo ? `${d.label} · page ${d.pageNo}` : d.label, cell.x, cell.y + fs); ctx.restore();
      ctx.lineWidth = Math.max(1, lw * 0.45);
      const grid = mazeGrid(designBox(g, d), d.c);   // same grid as the puzzle page, so it's the same maze
      drawDesign(ctx, g, inset({ ...cell, y: cell.y + fs * 1.6, h: cell.h - fs * 1.6 }, fs * 0.6), "maze", d.seed, d.c, ctx.lineWidth, { grid, solve: true });
    });
  } else if (spec.kind === "cover") {
    const b = g.box, fs = g.dpi * 0.5;
    ctx.save(); ctx.font = `700 ${fs}px ${FONT}`; ctx.textAlign = "center"; ctx.fillStyle = "#000";
    ctx.fillText(spec.title, b.x + b.w / 2, b.y + b.h * 0.14, b.w);
    const kinds = [...new Set(spec.designs.map(d => d.gen))];
    const sub = `${spec.designs.length} ${kinds.length === 1 ? GEN_NAMES[kinds[0]].toLowerCase() + (spec.designs.length > 1 ? " pages" : " page") : "pages"}` + (v("ramp") && spec.designs.length > 1 ? " · easy to hard" : "");
    ctx.font = `400 ${fs * 0.4}px ${FONT}`; ctx.fillStyle = "#444"; ctx.fillText(sub, b.x + b.w / 2, b.y + b.h * 0.14 + fs * 0.8, b.w);
    ctx.restore();
    const art = { x: b.x + b.w * 0.12, y: b.y + b.h * 0.26, w: b.w * 0.76, h: b.h * 0.66 };
    ctx.lineWidth = lw;
    drawDesign(ctx, g, art, spec.designs[0].gen === "maze" ? "mandala" : spec.designs[0].gen, (S.seed ^ 0x5bd1e995) >>> 0, 6, lw);
  }
}

function render() {
  const g = geometry();
  if (page.width !== g.W || page.height !== g.H) { page.width = g.W; page.height = g.H; }
  const book = S.mode === "make" && v("booklet");
  if (book) {
    const pages = bookPages(); S.bookPage = Math.min(Math.max(0, S.bookPage), pages.length - 1);
    drawPage(pctx, g, pages[S.bookPage]);
    const p = pages[S.bookPage];
    $("pagepos").textContent = `Page ${S.bookPage + 1} of ${pages.length}` + (p.kind === "cover" ? " · cover" : p.kind === "answers" ? " · answers" : "");
  } else drawPage(pctx, g, S.mode === "make" ? singlePage() : { kind: "photo" });
  // ink coverage estimate
  const sm = document.createElement("canvas"); sm.width = 200; sm.height = Math.round(200 * g.H / g.W);
  const sx = sm.getContext("2d", { willReadFrequently: true }); sx.drawImage(page, 0, 0, sm.width, sm.height);
  const d = sx.getImageData(0, 0, sm.width, sm.height).data; let dark = 0; for (let i = 0; i < d.length; i += 4) dark += 255 - d[i];
  const cov = dark / (d.length / 4) / 255 * 100;
  $("bar").innerHTML = `<span><b>${v("paper") === "a4" ? "A4" : "Letter"}</b> ${g.w} × ${g.h} in</span><span><b>${g.dpi}</b> dpi · ${g.W} × ${g.H} px</span><span>ink coverage <b>${cov.toFixed(1)}%</b></span>`;
}
let timer = 0;
function schedule() { $("busy").hidden = false; clearTimeout(timer); timer = setTimeout(() => { requestAnimationFrame(() => { try { render(); } finally { $("busy").hidden = true; } }); }, 40); }

function syncOutputs() {
  $("complexity-o").textContent = v("complexity") + " / 10";
  $("weight-o").textContent = (num("weight") / 150 * 25.4).toFixed(2) + " mm";
  $("brightness-o").textContent = (num("brightness") > 0 ? "+" : "") + v("brightness");
  $("contrast-o").textContent = v("contrast") + "%";
  $("threshold-o").textContent = v("threshold");
  $("dot-o").textContent = v("dot") + " px";
  $("seed-o").textContent = "seed " + S.seed;
  $("pages-o").textContent = v("pages");
  $("book-opts").hidden = !v("booklet");
}

/* ---------- inputs ---------- */
document.querySelectorAll("aside input, aside select").forEach(el => el.addEventListener("input", () => { syncOutputs(); schedule(); }));
function setMode(m) {
  S.mode = m; $("tab-make").setAttribute("aria-selected", m === "make"); $("tab-convert").setAttribute("aria-selected", m === "convert");
  $("panel-make").hidden = m !== "make"; $("panel-convert").hidden = m !== "convert";
  if (m === "convert" && !S.img) loadSample(); else schedule();
}
$("tab-make").onclick = () => setMode("make");
$("tab-convert").onclick = () => setMode("convert");
$("reroll").onclick = () => { S.seed = (Math.random() * 1e9) | 0; syncOutputs(); schedule(); };
$("prev").onclick = () => { S.bookPage--; schedule(); };
$("next").onclick = () => { S.bookPage++; schedule(); };
$("booklet").addEventListener("input", () => { S.bookPage = 0; });

function loadBlob(blob, name) {
  const url = URL.createObjectURL(blob), im = new Image();
  im.onload = () => { S.img = im; S.imgName = name || "image"; $("srcname").innerHTML = "<strong></strong>"; $("srcname").firstChild.textContent = S.imgName; if (S.mode !== "convert") setMode("convert"); else schedule(); };
  im.onerror = () => msg("That file couldn't be read as an image. Try a PNG, JPEG or WebP.");
  im.src = url;
}
$("file").onchange = e => { const f = e.target.files[0]; if (f) loadBlob(f, f.name); e.target.value = ""; };
const stage = $("stage");
["dragenter", "dragover"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); stage.classList.add("over"); }));
["dragleave", "drop"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); if (t === "drop" || !e.relatedTarget) stage.classList.remove("over"); }));
document.addEventListener("drop", e => { const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith("image/")); if (f) loadBlob(f, f.name); });
document.addEventListener("paste", e => { const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/")); if (it) loadBlob(it.getAsFile(), "pasted image"); });

function loadSample() {   // a procedurally painted landscape, so the converter has something to show
  const c = document.createElement("canvas"); c.width = 1400; c.height = 1000; const x = c.getContext("2d");
  let g = x.createLinearGradient(0, 0, 0, 620); g.addColorStop(0, "#5a7fb0"); g.addColorStop(1, "#f2d6b0"); x.fillStyle = g; x.fillRect(0, 0, 1400, 620);
  g = x.createRadialGradient(980, 330, 10, 980, 330, 160); g.addColorStop(0, "#fff8e0"); g.addColorStop(0.45, "#ffe7a8"); g.addColorStop(1, "rgba(255,230,170,0)"); x.fillStyle = g; x.fillRect(800, 150, 360, 360);
  const r = mulberry32(7), ridge = (base, amp, col1, col2) => { x.beginPath(); x.moveTo(0, 1000); let y = base; for (let px = 0; px <= 1400; px += 20) { y += (r() - 0.5) * amp; y = Math.max(base - amp * 3, Math.min(base + amp, y)); x.lineTo(px, y); } x.lineTo(1400, 1000); const gg = x.createLinearGradient(0, base - amp * 3, 0, 1000); gg.addColorStop(0, col1); gg.addColorStop(1, col2); x.fillStyle = gg; x.fill(); };
  ridge(430, 60, "#8a95a8", "#5f6b80"); ridge(520, 45, "#4f5d70", "#2f3a48");
  g = x.createLinearGradient(0, 620, 0, 1000); g.addColorStop(0, "#c9b79a"); g.addColorStop(1, "#47506a"); x.fillStyle = g; x.fillRect(0, 620, 1400, 380);
  ridge(700, 35, "#2b3324", "#141a12");
  x.fillStyle = "#1a1f16"; for (let i = 0; i < 26; i++) { const tx = r() * 1400, th = 80 + r() * 140, ty = 760 + r() * 160; x.beginPath(); x.moveTo(tx, ty - th); x.lineTo(tx - th * 0.25, ty); x.lineTo(tx + th * 0.25, ty); x.fill(); }
  c.toBlob(b => loadBlob(b, "Sample: mountain lake"));
}
$("sample").onclick = loadSample;

/* ---------- save & print (Qt bridge when running as the desktop app) ---------- */
let bridge = null;
function msg(t) { $("msg").textContent = t; }
function baseName() { return S.mode === "make" ? `inkline-${v("gen")}-${S.seed}` : `inkline-${(S.imgName || "photo").replace(/\.[^.]+$/, "").replace(/[^\w-]+/g, "-").toLowerCase()}`; }
function pngB64() { return page.toDataURL("image/png").split(",")[1]; }
function job(kind) {
  const g = geometry();
  return JSON.stringify({ kind, name: baseName(), png: pngB64(), dpi: g.dpi, paper: v("paper"), orient: v("orient") });
}
function browserDownload(ext) {
  if (ext === "pdf") { msg("PDF saving and printing need the desktop app. Saved a PNG instead."); }
  page.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = baseName() + ".png"; a.click(); });
}
const isBook = () => S.mode === "make" && v("booklet");
const call = (fn, ...a) => new Promise(res => bridge[fn](...a, res));

// Streams a booklet to the desktop shell one page at a time, so 40 pages at 300 dpi never sit in memory at once.
async function runBook(kind, testPath = "") {
  if (!bridge) { msg("Booklets need the desktop app, which writes multi-page PDFs and prints."); return "no bridge"; }
  if (S.bookBusy) return "busy";
  const g = geometry(), pages = bookPages();
  const meta = { kind, name: `inkline-booklet-${S.seed}`, dpi: g.dpi, paper: v("paper"), orient: v("orient"), count: pages.length, path: testPath };
  if (kind === "print") msg("Opening the print dialog…");
  const r = await call("bookBegin", JSON.stringify(meta));
  if (r !== "ok") { msg(r); return r; }
  S.bookBusy = true; ["print", "save-png", "save-pdf"].forEach(id => $(id).disabled = true);
  const off = document.createElement("canvas"); off.width = g.W; off.height = g.H;
  const octx = off.getContext("2d");
  try {
    for (let i = 0; i < pages.length; i++) {
      msg(`Rendering page ${i + 1} of ${pages.length}…`);
      await new Promise(res => setTimeout(res, 0));          // let the status line repaint
      drawPage(octx, g, pages[i]);
      const res = await call("bookPage", off.toDataURL("image/png").split(",")[1]);
      if (res !== "ok") { await call("bookAbort"); msg(res); return res; }
    }
    const done = await call("bookEnd"); msg(done); return done;
  } catch (e) {
    await call("bookAbort"); msg("The booklet couldn't be finished: " + e.message); return "error";
  } finally {
    S.bookBusy = false; ["print", "save-png", "save-pdf"].forEach(id => $(id).disabled = false);
  }
}

$("save-png").onclick = () => bridge ? bridge.request(job("png"), r => msg(r)) : browserDownload("png");
$("save-pdf").onclick = () => isBook() ? runBook("pdf") : bridge ? bridge.request(job("pdf"), r => msg(r)) : browserDownload("pdf");
$("print").onclick = () => isBook() ? runBook("print") : bridge ? (msg("Opening the print dialog…"), bridge.request(job("print"), r => msg(r))) : browserDownload("pdf");

// The desktop shell injects qwebchannel.js before this page runs.
if (window.qt && window.qt.webChannelTransport && typeof QWebChannel === "function") {
  new QWebChannel(qt.webChannelTransport, ch => { bridge = ch.objects.inkline; });
}

syncOutputs(); render();
</script>
