[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "inkline_fast"
version = "0.1.0"
description = "Optional Rust versions of two of Inkline's inner loops (a trial: see docs/performance.md)"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.maturin]
features = ["pyo3/extension-module"]
